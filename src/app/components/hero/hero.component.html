<section class="hero" id="home">
  <div class="container">
    <div class="hero-content">
      <div class="hero-text animate-fade-in">
        <h1 class="hero-title">¡Hola! Soy <span class="highlight">{{ name }}</span></h1>
        <p class="hero-subtitle">{{ title }}</p>
        <div class="hero-buttons">
          <a href="#projects" class="button button-primary">Ver Proyectos</a>
          <a href="#contact" class="button button-outline">Contactar</a>
        </div>
      </div>
      <div class="hero-image animate-fade-in">
        <img [src]="'/assets/perfil.jpg'" alt="Hero Image">
      </div>
    </div>
  </div>
</section>
