<section class="projects section" id="projects">
  <div class="container">
    <div class="section-header">
      <h2 class="title">Mis Proyectos</h2>
      <p class="subtitle">Algunos de mis trabajos más destacados</p>
    </div>
    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projects">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title">
          <div class="project-overlay">
            <div class="project-links">
              <a [href]="project.links.demo" class="project-link" target="_blank"><i class="fas fa-link"></i></a>
              <a [href]="project.links.github" class="project-link" target="_blank"><i class="fas fa-github"></i></a>
              <a [href]="project.links.live" class="project-link" target="_blank"><i class="fas fa-eye"></i></a>
            </div>
          </div>
        </div>
        <div class="project-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="project-tags">
            <span *ngFor="let tech of project.technologies">{{ tech }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
